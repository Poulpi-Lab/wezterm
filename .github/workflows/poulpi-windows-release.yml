# Poulpi-Lab fork: Windows x86_64 portable zip for a `pointer-shapes-r<N>` tag (the fork's own release number).
# Based on upstream's gen_windows_tag.yml, trimmed to the portable zip.
name: poulpi_windows_release

on:
  push:
    tags:
      - "pointer-shapes-r*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing pointer-shapes-r* tag to (re)build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: "windows-2025"
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"
      FORK_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      zip: ${{ steps.meta.outputs.zip }}
      upstream: ${{ steps.meta.outputs.upstream }}
      version: ${{ steps.meta.outputs.version }}
      stable: ${{ steps.meta.outputs.stable }}
      base_date: ${{ steps.meta.outputs.base_date }}
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          ref: ${{ env.FORK_TAG }}
          fetch-depth: 0
          submodules: "recursive"
      - name: "Upstream base and version"
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q https://github.com/wezterm/wezterm.git main:refs/remotes/upstream/main
          base=$(git merge-base HEAD upstream/main)
          version=$(git -c core.abbrev=8 show -s --format=%cd-%h --date=format:%Y%m%d-%H%M%S "$base")
          case "$FORK_TAG" in
            pointer-shapes-r[0-9]*) ;;
            *) echo "::error::tag $FORK_TAG is not pointer-shapes-r<N>"; exit 1;;
          esac
          git fetch -q --tags https://github.com/wezterm/wezterm.git 'refs/tags/20*:refs/tags/20*' || true
          stable=$(git describe --tags --abbrev=0 --match '20*' "$base" 2>/dev/null || echo unknown)
          # The changes this fork adds: every commit after the upstream base, minus the fork's own tooling.
          git log --reverse --format='- %s (%an, %h)' "$base"..HEAD -- . \
            ':!POULPI-LAB.md' ':!scripts/sync-upstream.sh' ':!.github/workflows/poulpi-*' > fork-changes.md
          # wezterm-version reads .tag: the binary reports upstream's version string.
          echo "$version" > .tag
          zipdir="WezTerm-windows-$FORK_TAG"
          {
            echo "upstream=$base"
            echo "version=$version"
            echo "zip=$zipdir.zip"
            echo "zipdir=$zipdir"
            echo "stable=$stable"
            echo "base_date=$(git show -s --format=%cs "$base")"
          } >> "$GITHUB_OUTPUT"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      # No sccache: through a wrapper, rustc's long -L list for mux overflows the Windows
      # command line (os error 206); plain cargo falls back to an argument file.
      - name: "Cache cargo"
        uses: Swatinem/rust-cache@v2
      # One package per cargo call, like upstream.
      - name: "Build wezterm (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release -p wezterm
      - name: "Build wezterm-gui (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release -p wezterm-gui
      - name: "Build wezterm-mux-server (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release -p wezterm-mux-server
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release -p strip-ansi-escapes
      - name: "Test the pointer-shapes crates"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo test --release -p wezterm-escape-parser && cargo test --release -p wezterm-term
      - name: "Check the reported version"
        shell: bash
        run: |
          out=$(target/release/wezterm.exe --version)
          echo "$out"
          case "$out" in *"${{ steps.meta.outputs.version }}"*) ;; *) echo "::error::unexpected version"; exit 1;; esac
      - name: "Package (same layout as upstream's portable zip)"
        shell: bash
        run: |
          set -euo pipefail
          zipdir="${{ steps.meta.outputs.zipdir }}"
          mkdir "$zipdir"
          cp target/release/wezterm.exe \
            target/release/wezterm-mux-server.exe \
            target/release/wezterm-gui.exe \
            target/release/strip-ansi-escapes.exe \
            target/release/wezterm.pdb \
            assets/windows/conhost/conpty.dll \
            assets/windows/conhost/OpenConsole.exe \
            assets/windows/angle/libEGL.dll \
            assets/windows/angle/libGLESv2.dll \
            "$zipdir"
          mkdir "$zipdir/mesa"
          cp target/release/mesa/opengl32.dll "$zipdir/mesa"
          7z a -tzip "$zipdir.zip" "$zipdir"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "windows"
          path: |
            ${{ steps.meta.outputs.zip }}
            fork-changes.md

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'Poulpi-Lab/wezterm'
    env:
      FORK_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "Download artifact"
        uses: actions/download-artifact@v8
        with:
          name: "windows"
      - name: "Checksum"
        run: sha256sum "${{ needs.build.outputs.zip }}" > "${{ needs.build.outputs.zip }}.sha256"
      - name: "Publish the release"
        run: |
          set -euo pipefail
          up="${{ needs.build.outputs.upstream }}"
          {
            echo "WezTerm for Windows x86_64 with mouse pointer shapes (OSC 22, kitty pointer-shapes protocol): hand, I-beam and resize cursors."
            echo
            echo "## Corresponding upstream version"
            echo
            echo "- Upstream \`main\` of ${{ needs.build.outputs.base_date }}, commit wezterm/wezterm@${up} (upstream nightly line)."
            echo "- \`wezterm --version\` reports upstream's version string: \`${{ needs.build.outputs.version }}\`."
            echo "- Latest upstream stable release before this base: \`${{ needs.build.outputs.stable }}\`."
            echo
            echo "## Changes on top of upstream"
            echo
            echo "The commits of the unmerged upstream PR wezterm/wezterm#8092 (Kitty Pointer Shapes Protocol, by NSPC911), then Poulpi-Lab's own fixes:"
            echo
            cat fork-changes.md
            echo
            echo "Portable zip, same layout as upstream's \`WezTerm-windows-*.zip\`. Unofficial build by Poulpi-Lab, see POULPI-LAB.md."
          } > notes.md
          if gh release view "$FORK_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload --clobber "$FORK_TAG" -R "$GITHUB_REPOSITORY" *.zip *.sha256
          else
            gh release create "$FORK_TAG" -R "$GITHUB_REPOSITORY" --title "$FORK_TAG" --notes-file notes.md *.zip *.sha256
          fi
